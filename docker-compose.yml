services:
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/eureka/apps"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - o-n-logistics
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    platform: linux/amd64

  # 다른 서비스들도 여기에 추가

networks:
  o-n-logistics:
    driver: bridge