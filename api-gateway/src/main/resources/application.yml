spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true # 서비스 디스커버리로 동적 라우트 생성
      auth:
        login:
          endpoint: /api/v1/auth/login
        signup:
          endpoint: /api/v1/auth/signup
        base:
          url: http://localhost:18081
        validate:
          endpoint: /gateway/v1/auth/validate
        secret:
          key: ENC(HI4A/uV5RCH/wOUjxaZDApv6DlH9ANhHYK87ojAyzTI=)
      routes:
        - id: auth-service # 인증 서비스
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**, /springdoc/openapi3-auth-service.json

        - id: user-service # 사용자 서비스
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**, /springdoc/openapi3-user-service.json

        - id: delivery-manager-service # 배송 담당자 서비스
          uri: lb://delivery-manager-service
          predicates:
            - Path=/api/v1/users/**, /springd #oc/openapi3-delivery-manager-service.json

        - id: order-service # 주문 서비스
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/** #, /springdoc/openapi3-order-service.json

        - id: delivery-service # 배송 서비스
          uri: lb://delivery-service
          predicates:
            - Path=/api/v1/delivery/** #, /springdoc/openapi3-delivery-service.json

        - id: company-service # 업체 서비스
          uri: lb://company-service
          predicates:
            - Path=/api/v1/company/** #, /springdoc/openapi3-company-service.json

        - id: product-service # 상품 서비스
          uri: lb://product-service
          predicates:
            - Path=/api/v1/product/** #, /springdoc/openapi3-product-service.json

        - id: hub-service # 허브 서비스
          uri: lb://hub-service
          predicates:
            - Path=/api/v1/hubs/** #, /springdoc/openapi3-hub-service.json

        - id: hub-transit-route-service # 허브 간 이동 정보 서비스
          uri: lb://hub-transit-route-service
          predicates:
            - Path=/api/v1/hub-transit/route/** #, /springdoc/openapi3-hub-transit-route-service.json

        - id: slack-service # 슬랙 서비스
          uri: lb://slack-service
          predicates:
            - Path=/api/v1/slack/** #, /springdoc/openapi3-slack-service.json

        - id: ai-service # AI 서비스
          uri: lb://ai-service
          predicates:
            - Path=/api/v1/ai/** #, /springdoc/openapi3-ai-service.json

        - id: map-service # 지도 서비스
          uri: lb://map-service
          predicates:
            - Path=/api/v1/maps/** #, /springdoc/openapi3-map-service.json
springdoc:
