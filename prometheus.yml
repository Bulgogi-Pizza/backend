global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'zipkin'
    static_configs:
      - targets: ['zipkin:9411']

  - job_name: 'spring-boot'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'api-gateway:8080'
          - 'auth-service:8080'
          - 'user-service:8080'
          - 'company-service:8080'
          - 'delivery-service:8080'
          - 'delivery-manager-service:8080'
          - 'hub-service:8080'
          - 'hub-transit-service:8080'
          - 'map-service:8080'
          - 'order-service:8080'
          - 'product-service:8080'
          - 'ai-service:8080'